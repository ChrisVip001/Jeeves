[package]
name = "jeeves-mcp"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
description = "The MCP client — wires somebody else's tools in as Jeeves's own."

[lib]
name = "jeeves_mcp"
path = "src/lib.rs"
doctest = false

[dependencies]
tempfile.workspace = true
jeeves-protocol = { workspace = true }
anyhow = { workspace = true }
# `jeeves mcp serve` (server.rs) reads and writes the memory tables directly — the server side
# needs state.
jeeves-state = { workspace = true }
jeeves-tools = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
#   PKCE in the OAuth code flow uses S256: challenge = base64url(sha256(verifier)).
#   No base64 crate — the encoding is 60 lines, so it is written out (see oauth.rs).
sha2 = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
jeeves-state = { workspace = true }

[lints]
workspace = true
