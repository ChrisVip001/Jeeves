[package]
name = "jeeves-tools"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
description = "What Jeeves can do: the model reads the schema, Rust does the work."

[lib]
name = "jeeves_tools"
path = "src/lib.rs"
doctest = false

[dependencies]
jeeves-protocol = { workspace = true }
anyhow = { workspace = true }
base64 = "0.22"
fs2.workspace = true
chrono = { workspace = true }
jeeves-agent = { workspace = true }
jeeves-memory = { workspace = true }
jsonschema = { workspace = true }
jeeves-provider = { workspace = true }
jeeves-state = { workspace = true }
sqlx = { workspace = true }
serde_json = { workspace = true }
#   Every search_web backend speaks HTTP: Tavily and Brave are JSON APIs, DuckDuckGo and Bing
#   mean fetching a page of HTML and picking it apart. One reqwest, no second client.
reqwest = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
