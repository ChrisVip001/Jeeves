name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Package and run the extracted CLI
        env:
          TARGET: ${{ matrix.target }}
        run: |
          tag_args=()
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            tag_args=(--tag "$GITHUB_REF_NAME")
          fi
          python3 scripts/package-release.py build --target "$TARGET" --output dist "${tag_args[@]}"
      - name: Run the release evals from the Linux archive
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          tar -xzf dist/jeeves-v*-x86_64-unknown-linux-gnu.tar.gz -C "$stage"
          export JEEVES_HOME="$stage/state"
          "$stage/jeeves" eval evals/deterministic
          "$stage/jeeves" eval --replay evals/replay
      - uses: actions/upload-artifact@v5
        with:
          name: jeeves-${{ matrix.target }}
          path: dist/jeeves-v*.tar.gz
          if-no-files-found: error

  assets:
    needs: binaries
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v5
        with:
          path: dist
          pattern: jeeves-*
          merge-multiple: true
      - name: Check the complete release set
        run: python3 scripts/package-release.py checksums --output dist
      - uses: actions/upload-artifact@v5
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: assets
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: release-assets
          path: dist
      - name: Publish the verified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          (cd dist && sha256sum --check SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Jeeves $GITHUB_REF_NAME" \
            --notes-file ".github/release-notes/${GITHUB_REF_NAME}.md" \
            dist/jeeves-v*.tar.gz dist/SHA256SUMS
