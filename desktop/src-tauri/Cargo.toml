[package]
name = "jeeves-desktop"
version = "0.17.0"
description = "The Jeeves desktop shell: the cockpit front end plus a client for any Jeeves server"
edition = "2021"

[features]
cloud-device = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# A workspace of its own: the shell's dependency tree (tauri/wry) should not join every
# `cargo build` in jeeves-rs.
[workspace]
