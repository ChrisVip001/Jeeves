[package]
name = "jeeves-desktop"
version = "0.18.0"
description = "The Jeeves desktop shell: the cockpit front end plus a client for any Jeeves server"
edition = "2024"

[features]
cloud-device = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSLocale", "NSString"] }

# A workspace of its own: the shell's dependency tree (tauri/wry) should not join every
# `cargo build` at the repository root.
[workspace]
