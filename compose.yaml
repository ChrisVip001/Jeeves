# One command for a server install:  JEEVES_OPS_TOKEN=$(openssl rand -hex 24) docker compose up -d
# Open http://<host>:7777, paste the token when asked, and the setup wizard does the rest.
# Models, permissions and chat connections are all set in the dashboard; nothing else to configure.
services:
  jeeves:
    build: .
    image: jeeves
    restart: unless-stopped
    ports:
      - "7777:7777"
    environment:
      # Required: the cockpit is bound to all interfaces inside the container.
      JEEVES_OPS_TOKEN: ${JEEVES_OPS_TOKEN:?set JEEVES_OPS_TOKEN, e.g. openssl rand -hex 24}
    volumes:
      - jeeves-state:/home/jeeves/.jeeves
    # `docker stop` sends SIGTERM; Jeeves drains running turns for up to 25 s.
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7777/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  jeeves-state:
